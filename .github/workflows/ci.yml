# Build + test validation for every PR and for pushes to main.
# Publishing lives in publish.yml (only on a version bump); this just gates changes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run compile

  # Flags known-malicious / vulnerable dependency changes on PRs. Needs the dependency
  # graph, which is free on public repos only — hence the visibility gate.
  dependency-review:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
