# Build, test and publish the Nexius Release Dashboard extension to the Azure DevOps
# Marketplace. Publishing runs under the BOT identity via the AZURE_DEVOPS_MARKETPLACE_PAT
# secret (a Marketplace "Manage"-scoped PAT of the service/bot account) — never a personal
# token — and waits for an approval on the `marketplace` environment.
#
# Split in two jobs on purpose: `check` always builds and tests, `publish` carries the
# environment (and therefore the approval prompt) and only runs when the version actually
# changed. Gating the whole thing in one job would ask for an approval on every push to
# extension/**, including ones that would publish nothing.
name: Publish extension

on:
  push:
    branches: [main]
    paths: ['extension/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.repository == 'nexius-learning/nexius-release-dashboard'
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.ver.outputs.publish }}
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run compile

      - name: Detect version bump
        id: ver
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git diff "${{ github.event.before }}" "${{ github.sha }}" -- extension/configs/nexius.json | grep -q '^[+-] *"version"'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No version bump in configs/nexius.json — skipping publish."
          fi
          VERSION=$(node -p "require('./extension/configs/nexius.json').version")
          # Strict semver guard: the value is interpolated into later steps, so never
          # let a crafted "version" from a merged change reach the shell unvalidated.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version in configs/nexius.json: $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: marketplace # holds the Marketplace PAT; approval + main-only deployments
    permissions:
      contents: read
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # Rebuilt here rather than handed over as an artifact: npm ci is lockfile-pinned, so
      # this reproduces the checked build, and the publish job stays self-contained.
      - run: npm ci
      - run: npm run compile

      - name: Publish to ADO Marketplace
        run: >-
          npx tfx-cli extension publish
          --manifest-globs vss-extension.json
          --overrides-file configs/nexius.json
          --auth-type pat
          --token "$MARKETPLACE_PAT"
          --no-wait-validation
        env:
          MARKETPLACE_PAT: ${{ secrets.AZURE_DEVOPS_MARKETPLACE_PAT }}

  # Tagging and the GitHub release are bookkeeping, not a deployment: they live outside the
  # marketplace environment. That is also the only shape observed to work — creating a release
  # from inside the gated job fails with "Resource not accessible by integration" even though the
  # token reports contents:write, while this exact configuration succeeds consistently.
  release:
    needs: [check, publish]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tag + GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }} # env-indirected — never inline ${{ }} into the script
        run: |
          TAG="v${VERSION}"
          # The extension is already on the Marketplace by this point, so this must not fail
          # silently: skip when the release exists (safe re-runs) and retry before giving up.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          for attempt in 1 2 3; do
            # Auto-generated notes (categorised by .github/release.yml) from PRs since the last release.
            if gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"; then
              exit 0
            fi
            echo "Creating release $TAG failed (attempt $attempt/3)."
            [ "$attempt" -lt 3 ] && sleep 15
          done
          echo "Could not create release $TAG. The extension WAS published to the Marketplace —"
          echo "create the release manually against $GITHUB_SHA, or re-run this job."
          exit 1
